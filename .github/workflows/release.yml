name: Release

on:
  release:
    types:
    - published

permissions:
  contents: read
  id-token: write

jobs:
  registries:
    name: Publish to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Go toolchain
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Install Node toolchain
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        registry-url: https://registry.npmjs.org

    - name: Set version
      id: version
      # Tags are v<major>.<SDE build>.<n>, so a release always builds the SDE it names.
      run: |
        VERSION=$(echo ${{ github.ref_name }} | cut -b2-)
        BUILD=$(echo ${VERSION} | cut -d. -f2)
        echo "Version: ${VERSION}"
        echo "SDE build: ${BUILD}"

        npm version --no-git-tag-version "${VERSION}"
        echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
        echo "build=${BUILD}" >> "${GITHUB_OUTPUT}"

    - name: Build SDE export
      run: |
        go run ./cmd/sde-patched build --build ${{ steps.version.outputs.build }}

    - name: Publish to NPM
      # Authenticates via trusted publishing; no token needed.
      run: |
        if [ -n "$(npm view @eveshipfit/sde@${{ steps.version.outputs.version }} version 2>/dev/null)" ]; then
          echo "Already published"
          exit 0
        fi
        npm publish
