name: Release

on:
  workflow_dispatch:
  release:
    types:
    - published

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  check:
    name: Scheduled build
    # A release made by hand skips this; it is published as-is.
    if: github.event_name != 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Go toolchain
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Build SDE export
      id: build
      run: |
        BUILD=$(curl -sSfL https://developers.eveonline.com/static-data/tranquility/latest.jsonl | jq -r 'select(._key == "sde") | .buildNumber')
        echo "SDE build: ${BUILD}"

        go run ./cmd/sde-patched build --build "${BUILD}"
        echo "build=${BUILD}" >> "${GITHUB_OUTPUT}"

    - name: Compare with latest release
      id: compare
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PREVIOUS=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
        if [ -z "${PREVIOUS}" ]; then
          echo "No release yet"
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        echo "Latest release: ${PREVIOUS}"
        echo "previous=${PREVIOUS}" >> "${GITHUB_OUTPUT}"

        gh release download "${PREVIOUS}" --pattern '*.dat' --dir previous
        RESULT=$(go run ./cmd/sde-patched compare previous)
        echo "Result: ${RESULT}"

        if [ "${RESULT}" = "changed" ]; then
          echo "changed=true" >> "${GITHUB_OUTPUT}"
        fi

    - name: Create release
      id: release
      if: steps.compare.outputs.changed == 'true'
      # Tags are v<major>.<SDE build>.<n>; n counts releases of the same SDE build.
      env:
        GH_TOKEN: ${{ github.token }}
        PREVIOUS: ${{ steps.compare.outputs.previous }}
        BUILD: ${{ steps.build.outputs.build }}
      run: |
        MAJOR=1
        N=0
        if [ -n "${PREVIOUS}" ]; then
          MAJOR=$(echo "${PREVIOUS}" | cut -b2- | cut -d. -f1)
          if [ "$(echo "${PREVIOUS}" | cut -d. -f2)" = "${BUILD}" ]; then
            N=$(( $(echo "${PREVIOUS}" | cut -d. -f3) + 1 ))
          fi
        fi
        TAG="v${MAJOR}.${BUILD}.${N}"
        echo "Release: ${TAG}"

        NOTES=$(printf "## What's Changed\n* Update to SDE build %s" "${BUILD}")

        COMMITS=0
        if [ -n "${PREVIOUS}" ]; then
          COMMITS=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${GITHUB_SHA}" --jq '.commits | length')
        fi

        # Without commits of our own, --generate-notes reaches past the previous
        # release and repeats its changelog; ask for the notes ourselves instead,
        # and fold them into the list above so both cases read the same.
        if [ "${COMMITS}" != "0" ]; then
          GENERATED=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f previous_tag_name="${PREVIOUS}" \
            --jq .body | sed "0,/^## What.s Changed$/d")
          NOTES=$(printf "%s\n%s" "${NOTES}" "${GENERATED}")
        fi

        gh release create "${TAG}" --target "${GITHUB_SHA}" --title "${TAG}" --notes "${NOTES}"
        echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish to NPM
    needs: check
    if: ${{ !cancelled() && !failure() && (github.event_name == 'release' || needs.check.outputs.tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.check.outputs.tag || github.ref_name }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ env.TAG }}

    - name: Install Go toolchain
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Install Node toolchain
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        registry-url: https://registry.npmjs.org

    - name: Install Python toolchain
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Set version
      id: version
      # Tags are v<major>.<SDE build>.<n>, so a release always builds the SDE it names.
      run: |
        VERSION=$(echo "${TAG}" | cut -b2-)
        BUILD=$(echo "${VERSION}" | cut -d. -f2)
        echo "Version: ${VERSION}"
        echo "SDE build: ${BUILD}"

        npm version --no-git-tag-version "${VERSION}"
        sed -i 's/^version = "0.0.0"$/version = "'${VERSION}'"/' pyproject.toml
        echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
        echo "build=${BUILD}" >> "${GITHUB_OUTPUT}"

    - name: Build SDE export
      run: |
        go run ./cmd/sde-patched build --build ${{ steps.version.outputs.build }}

    - name: Upload to GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${TAG}" dist/sde.dat dist/names.dat --clobber

    - name: Create Python package
      run: |
        pip install build
        python -m build --wheel --sdist --outdir pythondist

    - name: Upload Python package
      uses: actions/upload-artifact@v5
      with:
        name: python-package
        path: pythondist

    - name: Publish to NPM
      run: |
        if [ -n "$(npm view @eveshipfit/sde@${{ steps.version.outputs.version }} version 2>/dev/null)" ]; then
          echo "Already published"
          exit 0
        fi
        npm publish

  pypi:
    name: Publish to PyPI
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write

    steps:
    - name: Download Python package
      uses: actions/download-artifact@v6
      with:
        name: python-package
        path: dist

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
