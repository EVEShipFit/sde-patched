# chargeAmount — how many charges fit in a module.

new:
  default: 1
  highIsGood: true

effects:
  - name: chargeAmount
    on: holdsCharge
    category: passive
    isWarpSafe: true
    rules:
      - {from: capacity}

  - name: chargeAmount2
    on: isCharge
    category: passive
    isWarpSafe: true
    rules:
      - {div: volume, domain: otherID}
