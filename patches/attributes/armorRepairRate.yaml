# armorRepairRate — repair and boost rates, for the modules that do the
# repairing and for the ship that receives it. The effective rate also takes
# resistances into account, so it can be compared with incoming damage. The
# three layers work the same way; they differ in which attributes the SDE
# keeps their numbers in.

new:
  highIsGood: true

effects:
  - name: armorRepairRate
    on: armorRepairModule
    category: active
    isWarpSafe: true
    rules:
      - {from: thousand}
      - {mul: armorDamageAmount}
      - {div: duration}
      - {add: armorRepairRate, domain: shipID}

  # A remote repairer reaches the ship it is aimed at. The strength is its
  # own; the spool multiplier is 1 for everything that does not spool.
  - name: remoteArmorRepairRate
    on: remoteArmorRepairModule
    category: active
    isWarpSafe: true
    resistanceAttribute: remoteRepairImpedance
    rangeAttribute: maxRange
    falloffAttribute: falloffEffectiveness
    rules:
      - {from: thousand}
      - {mul: armorDamageAmount}
      - {mul: spoolMultiplier}
      - {div: duration}
      - {add: armorRepairRate, domain: targetID}
