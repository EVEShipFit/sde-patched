new:
  displayName: Damage Per Second (with reload)
  category: Miscellaneous
  highIsGood: true

effects:
  - name: damagePerSecondWithReload
    on: moduleCycles and holdsCharge
    category: active
    rules:
      - {from: thousand}
      - {mul: damageVolley}
      - {div: speedWithReload}
      - {add: damagePerSecondWithReload, domain: shipID}

  # Without a charge there is nothing to reload.
  - name: damagePerSecondWithReload2
    on: damagingDrone or (moduleCycles and not holdsCharge)
    category: active
    rules:
      - {add: damagePerSecondWithoutReload, domain: shipID}

  - name: damagePerSecondWithReload3
    on: isCharge and attribute("dotMaxDamagePerTick")
    category: passive
    rules:
      - {assign: dotMaxDamagePerTick, domain: otherID}

  - name: damagePerSecondWithReload4
    on: isFighter
    category: passive
    rules:
      - {add: damagePerSecondWithReload, domain: shipID}

  - name: damagePerSecondWithReload5
    on: spoolsDamage
    category: active
    rules:
      - {mul: spoolMultiplier}

# Missiles run out of charges and have to rearm, which is not counted yet; so
# only the attack ability is sustained damage.
addTo:
  - effect: fighterAbilityAttackM
    rules:
      - {add: fighterAbilityAttackMissileDamagePerSecond}
