# scanResolution — remote sensor dampeners and boosters. The SDE leaves the
# player modules without modifiers; only their NPC twins carry them.

addTo:
  - effect: remoteSensorDampFalloff
    rules:
      - {percent: scanResolutionBonus, domain: targetID}
  - effect: remoteSensorDampEntity
    rules:
      - {percent: scanResolutionBonus, domain: targetID}
  - effect: remoteSensorBoostFalloff
    rules:
      - {percent: scanResolutionBonus, domain: targetID}
