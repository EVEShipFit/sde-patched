# scanStrength — statistics show a single scan strength, but the SDE has one
# attribute per race. On a ship three of the four are zero, so adding them
# up gives the one number a user interface wants.

new:
  highIsGood: true

effects:
  - name: scanStrength
    on: isShip
    category: passive
    isWarpSafe: true
    rules:
      - {add: scanRadarStrength}
      - {add: scanLadarStrength}
      - {add: scanMagnetometricStrength}
      - {add: scanGravimetricStrength}

  # A structure has all four, and all the same.
  - name: scanStrength2
    on: isStructure
    category: passive
    isWarpSafe: true
    rules:
      - {add: scanRadarStrength}
