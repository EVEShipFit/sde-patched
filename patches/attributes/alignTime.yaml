# alignTime — align time in seconds. The EVE client works this out itself,
# so the SDE has no attribute for it.

new:
  default: 1.3862943611198906 # -ln(0.25)
  highIsGood: false

effects:
  - on: isShip
    category: passive
    isWarpSafe: true
    rules:
      - {mul: agility}
      - {mul: mass}
      # Twice: once for the mass in kilogrammes, once for the milliseconds.
      - {div: thousand}
      - {div: thousand}
