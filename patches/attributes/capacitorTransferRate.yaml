# capacitorTransferRate — the capacitor a module moves between itself and what
# it is aimed at, in GJ/s. Always positive; which way it goes is decided where
# it lands.

new:
  highIsGood: true

effects:
  - name: capacitorTransferRate
    on: remoteCapacitorTransmitter or energyNosferatu
    category: active
    isWarpSafe: true
    rules:
      - {from: thousand}
      - {mul: powerTransferAmount}
      - {div: duration}

  - name: capacitorTransferRateNeutralizer
    on: energyNeutralizer
    category: active
    isWarpSafe: true
    rules:
      - {from: thousand}
      - {mul: energyNeutralizerAmount}
      - {div: duration}
