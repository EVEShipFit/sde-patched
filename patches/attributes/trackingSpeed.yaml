# trackingSpeed — tracking disruptors and remote tracking computers, which
# reach the turrets of the ship they are aimed at.

addTo:
  - effect: shipModuleTrackingDisruptor
    rules:
      - {percent: trackingSpeedBonus, domain: targetID, func: locationRequiredSkillModifier, skill: Gunnery}
  - effect: npcEntityWeaponDisruptor
    rules:
      - {percent: trackingSpeedBonus, domain: targetID, func: locationRequiredSkillModifier, skill: Gunnery}
  - effect: shipModuleRemoteTrackingComputer
    rules:
      - {percent: trackingSpeedBonus, domain: targetID, func: locationRequiredSkillModifier, skill: Gunnery}
