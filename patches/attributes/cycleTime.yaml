new:
  highIsGood: false

effects:
  # Modules keep their cycle time in one of several different attributes.
  - name: cycleTime
    on: usesCapacitor and attribute("duration")
    category: active
    isWarpSafe: true
    rules:
      - {add: duration}

  - name: cycleTime2
    on: usesCapacitor and attribute("durationHighisGood")
    category: active
    isWarpSafe: true
    rules:
      - {add: durationHighisGood}

  - name: cycleTime3
    on: usesCapacitor and attribute("speed")
    category: active
    isWarpSafe: true
    rules:
      - {add: speed}

  - name: cycleTime4
    on: usesCapacitor and attribute("moduleReactivationDelay")
    category: active
    isWarpSafe: true
    rules:
      - {add: moduleReactivationDelay}

  - name: cycleTime5
    on: usesCapacitor and attribute("durationECMJammerBurstProjector")
    category: active
    isWarpSafe: true
    rules:
      - {add: durationECMJammerBurstProjector}

  - name: cycleTime6
    on: usesCapacitor and attribute("durationSensorDampeningBurstProjector")
    category: active
    isWarpSafe: true
    rules:
      - {add: durationSensorDampeningBurstProjector}

  - name: cycleTime7
    on: usesCapacitor and attribute("durationTargetIlluminationBurstProjector")
    category: active
    isWarpSafe: true
    rules:
      - {add: durationTargetIlluminationBurstProjector}

  - name: cycleTime8
    on: usesCapacitor and attribute("durationWeaponDisruptionBurstProjector")
    category: active
    isWarpSafe: true
    rules:
      - {add: durationWeaponDisruptionBurstProjector}
