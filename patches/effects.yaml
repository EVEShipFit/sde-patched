# Effects of CCP's that need changing in a way no single attribute owns.
# Everything else lives with the attribute it is about.

changes:
  # The SDE puts "online" in the "active" category. The EVE client does some
  # magic here; for a dogma-engine it simply belongs in "online".
  - {effect: online, category: online}

  # The SDE puts the damaging fighter abilities in "target", which a
  # dogma-engine never applies to the fighter itself. Missiles are also on by
  # default, so a fit counts their damage without picking abilities.
  - {effect: fighterAbilityAttackM, category: active}
  - {effect: fighterAbilityMissiles, category: active, default: true}
